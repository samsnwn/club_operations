# Phase 0.5 dev stack entry: independent FastAPI service on :8081.
# Sources bind-mounted for hot reload; invoice store (SQLite) and captured
# originals stay in named volumes — club invoice files never live outside a
# volume (hard rule 3). Migrations apply before serving, same pattern as the
# main backend.

name: blue-velvet

services:
  backend:
    build:
      context: ../backend
      target: dev
    init: true
    ports:
      - "8080:8080"
    environment:
      # Keep SQLite inside the container's named volume, not a bind mount.
      DATABASE_URL: "sqlite:////data/blue_velvet.db"
      INVOICE_SERVICE_URL: "http://invoice-service:8081"
      INVOICE_SERVICE_TOKEN: "development-invoice-service-token"
    volumes:
      - backend-db-data:/data
      # Source binds for StatReload hot reload (application code, tests, and
      # migration definitions). Dependencies come from the image.
      - ../backend/app:/app/app
      - ../backend/tests:/app/tests
      - ../backend/alembic:/app/alembic
      - ../backend/alembic.ini:/app/alembic.ini
      - ../backend/pyproject.toml:/app/pyproject.toml
      - ../backend/uv.lock:/app/uv.lock
    command: ["sh", "-c", "uv run alembic upgrade head && uvicorn app.main:app --reload --host 0.0.0.0 --port 8080"]

  frontend:
    build:
      context: ../frontend
      target: dev
    init: true
    ports:
      - "5173:5173"
    environment:
      # Vite proxies same-origin /api requests here (BACKEND_URL inside the network).
      BACKEND_URL: "http://backend:8080"
    depends_on:
      - backend
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/index.html:/app/index.html
      - ../frontend/vite.config.ts:/app/vite.config.ts
      - ../frontend/eslint.config.js:/app/eslint.config.js
      - ../frontend/tsconfig.json:/app/tsconfig.json
      - ../frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ../frontend/tsconfig.node.json:/app/tsconfig.node.json
      - frontend-node-modules:/app/node_modules
      - frontend-vite-cache:/app/node_modules/.vite

  invoice-service:
    build:
      context: ../invoice-service
      target: dev
    init: true
    ports:
      - "8081:8081"
    environment:
      INVOICE_INTERNAL_TOKEN: "development-invoice-service-token"
    volumes:
      - invoice-data:/app/data
      - ../invoice-service/data/inbox:/app/data/inbox
      - ../invoice-service/app:/app/app
      - ../invoice-service/tests:/app/tests
      - ../invoice-service/alembic:/app/alembic
      - ../invoice-service/alembic.ini:/app/alembic.ini
      - ../invoice-service/pyproject.toml:/app/pyproject.toml
      - ../invoice-service/uv.lock:/app/uv.lock
    # Review tokens and mail creds come from env when they exist (hard rule 3).
    # Until Gmail/Drive credentials are present, ingestion degrades to fixture
    # mode — see invoice-service/README.md.
    command: ["sh", "-c", "uv run alembic upgrade head && uvicorn app.main:app --reload --host 0.0.0.0 --port 8081"]

volumes:
  backend-db-data:
  frontend-node-modules:
  frontend-vite-cache:
  invoice-data:
