# Phase 0.5 dev stack entry: independent FastAPI service on :8081.
# Sources bind-mounted for hot reload; invoice store (SQLite) and captured
# originals stay in named volumes — club invoice files never live outside a
# volume (hard rule 4). Migrations apply before serving, same pattern as the
# main backend.

name: blue-velvet

services:
  backend:
    build:
      context: ../backend
      target: dev
    init: true
    ports:
      # Loopback only: the LAN reaches the API through the proxy service. This
      # binding is what makes --forwarded-allow-ips='*' below safe, since only
      # Caddy (and the host itself) can set X-Forwarded-* headers.
      - "127.0.0.1:8080:8080"
    env_file:
      # Gitignored service settings (auth config + invoice-service token), so
      # no secret is hard-coded in this file. Copy backend/.env.example first.
      - path: ../backend/.env
        required: false
    environment:
      # Keep SQLite inside the container's named volume, not a bind mount.
      DATABASE_URL: "sqlite:////data/blue_velvet.db"
      INVOICE_SERVICE_URL: "http://invoice-service:8081"
    volumes:
      - backend-db-data:/data
      # Source binds for StatReload hot reload (application code, tests, and
      # migration definitions). Dependencies come from the image.
      - ../backend/app:/app/app
      - ../backend/tests:/app/tests
      - ../backend/alembic:/app/alembic
      - ../backend/alembic.ini:/app/alembic.ini
      - ../backend/pyproject.toml:/app/pyproject.toml
      - ../backend/uv.lock:/app/uv.lock
    command: ["sh", "-c", "uv run alembic upgrade head && uvicorn app.main:app --reload --host 0.0.0.0 --port 8080 --proxy-headers --forwarded-allow-ips='*'"]

  frontend:
    build:
      context: ../frontend
      target: dev
    init: true
    ports:
      # Loopback only: the LAN reaches the PWA through the proxy service.
      - "127.0.0.1:5173:5173"
    environment:
      # Vite proxies same-origin /api requests here (BACKEND_URL inside the network).
      BACKEND_URL: "http://backend:8080"
      # Extra hostname Vite accepts when served through the proxy (infra/.env).
      PUBLIC_HOST: ${PUBLIC_HOST:-}
    depends_on:
      - backend
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/index.html:/app/index.html
      - ../frontend/vite.config.ts:/app/vite.config.ts
      - ../frontend/eslint.config.js:/app/eslint.config.js
      - ../frontend/tsconfig.json:/app/tsconfig.json
      - ../frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ../frontend/tsconfig.node.json:/app/tsconfig.node.json
      # Dependencies come from the image; only the Vite pre-bundle cache is
      # persisted so restarts stay fast. Safe to delete at any time.
      - frontend-vite-cache:/app/node_modules/.vite

  invoice-service:
    build:
      context: ../invoice-service
      target: dev
    init: true
    ports:
      - "127.0.0.1:8081:8081"
    env_file:
      # Gitignored service settings, including INVOICE_INTERNAL_TOKEN; the
      # token must match backend/.env INVOICE_SERVICE_TOKEN.
      - path: ../invoice-service/.env
        required: false
    environment:
      # The service refuses to start with the known development token in
      # production. The dev stack opts into development explicitly; production
      # compose overrides must set "production" and a unique token.
      INVOICE_ENVIRONMENT: "development"
    volumes:
      - invoice-data:/app/data
      - ../invoice-service/data/inbox:/app/data/inbox
      # Drive service-account key (gitignored); see invoice-service/README.md.
      - ../invoice-service/secrets:/app/secrets:ro
      - ../invoice-service/app:/app/app
      - ../invoice-service/tests:/app/tests
      - ../invoice-service/alembic:/app/alembic
      - ../invoice-service/alembic.ini:/app/alembic.ini
      - ../invoice-service/pyproject.toml:/app/pyproject.toml
      - ../invoice-service/uv.lock:/app/uv.lock
    # Tokens and mail creds come from env when they exist (hard rule 4).
    # Import reads the Google Drive invoice folder when INVOICE_DRIVE_* are set
    # in invoice-service/.env, otherwise the local inbox
    # (invoice-service/data/inbox) — see invoice-service/README.md.
    command: ["sh", "-c", "uv run alembic upgrade head && uvicorn app.main:app --reload --host 0.0.0.0 --port 8081"]

  proxy:
    # Dev HTTPS on :443 (:80 redirects) for https://localhost and
    # https://<PUBLIC_HOST>; see Caddyfile and README.md "HTTPS for phones".
    image: caddy:2.11.9
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Optional LAN IP from infra/.env; empty serves localhost only.
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      # Certificate for clients that send no SNI (bare IPs): the LAN IP when
      # set, otherwise localhost. Never empty, or Caddy rejects the config.
      DEFAULT_SNI: ${PUBLIC_HOST:-localhost}
    depends_on:
      - backend
      - frontend
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The local certificate authority lives here: `down -v` replaces it and
      # every device must trust the new root (pnpm dev-ca).
      - caddy-data:/data
      - caddy-config:/config

volumes:
  backend-db-data:
  frontend-vite-cache:
  invoice-data:
  caddy-data:
  caddy-config:
