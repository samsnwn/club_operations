[project]
name = "blue-velvet-invoice-service"
version = "0.1.0"
description = "Phase 0.5 — Invoice ingestion quick win (ingest → extract → review → export)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13",
    "uvicorn>=0.29",
    "pypdf>=5",
    "google-auth>=2.63.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
