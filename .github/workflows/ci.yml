name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint, format, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: '{backend,invoice-service}/uv.lock'

      - name: Install formatting dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Validate compose file
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Install backend dependencies
        run: uv sync
        working-directory: backend

      - name: Lint backend
        run: uv run ruff check .
        working-directory: backend

      - name: Apply backend migrations
        run: uv run alembic upgrade head
        working-directory: backend

      - name: Run backend tests
        run: uv run pytest --strict-markers --strict-config
        working-directory: backend

      - name: Install invoice service dependencies
        run: uv sync
        working-directory: invoice-service

      - name: Lint invoice service
        run: uv run ruff check .
        working-directory: invoice-service

      - name: Apply invoice service migrations
        run: uv run alembic upgrade head
        working-directory: invoice-service
        env:
          # Migrations only need to prove the chain applies; keep CI free of
          # a data directory and of any real invoice store.
          INVOICE_DATABASE_URL: 'sqlite:///:memory:'

      - name: Run invoice service tests
        run: uv run pytest --strict-markers --strict-config
        working-directory: invoice-service

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Lint frontend
        run: pnpm run lint
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend
